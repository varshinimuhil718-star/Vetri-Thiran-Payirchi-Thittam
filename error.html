{% extends "base.html" %}
{% block title %}FitBuddy — Error{% endblock %}
{% block content %}
<section class="card error-card">
    <p class="eyebrow">SOMETHING NEEDS ATTENTION</p>
    <h1>We couldn't complete that request.</h1>
    <p>{{ message }}</p>
    <div class="center-actions">
        <a class="primary-btn inline-btn" href="/">Back to FitBuddy</a>
        <a class="secondary-btn" href="/docs">Open API docs</a>
    </div>
</section>
{% endblock %}
